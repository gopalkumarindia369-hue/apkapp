name: Build NotiVault APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to manually trigger the build with 1 click from GitHub

jobs:
  build:
    runs-on: ubuntu-latest # Runs in a clean GitHub cloud Linux machine with Android SDK pre-installed

    steps:
      # Step 1: Download your repository files onto the cloud machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Java Development Kit (JDK 17) and enable Gradle caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Step 3: Ensure the Gradle script is executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 4: Compile Kotlin code, generate Room KSP code, link SQLCipher, and package the APK
      - name: Compile and Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Step 5: Save and publish the finished APK file as a downloadable file
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotiVault-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
